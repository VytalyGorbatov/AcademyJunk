    "norm_groups": 8,

    "prefix_lengths": [128, 256, 512],

    "buffer_proj_dim": 192,
    "fusion_hidden_dim": 256,

    "share_byte_encoder": false,
    "use_film": false,

    "num_classes": null,

    "class_weights": [1.0, 5.0]
  },
  "artifacts": {
    "out_dir": "./artifacts",
    "best_metric": "f1"

{
  "seed": 123456,
  "attack_percent": 0.1,
  "sampling": {
    "with_replacement": false
  },
  "benign_paths": {
    "train": "../benign/train.json",
    "val": "../benign/val.json",
    "test": "../benign/test.json"
  },
  "attack_paths": {
    "train": "../attack/train.json",
    "val": "../attack/val.json",
    "test": "../attack/test.json"
  },
  "data": {
    "buffer_field": "buffers",
    "label_field": "alerted",
    "split_by": "alerted",
    "fixed_len": 1024
  },
  "training": {
    "batch_size": 64,
    "epochs": 20,
    "learning_rate": 5e-4,
    "weight_decay": 1e-4

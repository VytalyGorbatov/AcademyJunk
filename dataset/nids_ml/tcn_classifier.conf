{
  "seed": 123456,
  "attack_percent": 0.35,
  "sampling": {
    "with_replacement": false
  },
  "benign_paths": {
    "train": "../benign/train.json",
    "val": "../benign/val.json",
    "test": "../benign/test.json"
  },
  "attack_paths": {
    "train": "../attack/train.json",
    "val": "../attack/val.json",
    "test": "../attack/test.json"
  },
  "data": {
    "buffer_field": "buffers",
    "label_field": "alerted",
    "split_by": "alerted",
    "fixed_len": 1024,
    "sep_byte": 24,
    "fallback_header_len": 512
  },
  "training": {
    "batch_size": 64,
    "epochs": 60,
    "learning_rate": 3e-4,
    "weight_decay": 1e-3,
    "patience": 10,
    "pu_prior": 0.30,
    "lr_scheduler": {
      "factor": 0.5,
      "patience": 4,
      "min_lr": 1e-6
    }
  },
  "testing": {
    "log_samples": 2000
  },
  "model": {
    "type": "tcn",
    "threshold": 0.4,

    "vocab_size": 257,
    "pad_idx": 256,
    "byte_embed_dim": 24,

    "tcn_channels": 64,
    "tcn_kernel_size": 5,
    "tcn_dilations": [1, 2, 4],
    "tcn_dropout": 0.25,
    "norm_groups": 8,

    "prefix_lengths": [128, 256],

    "buffer_proj_dim": 128,
    "fusion_hidden_dim": 128,

    "share_byte_encoder": false,
    "use_film": false,

    "num_classes": null,

    "class_weights": [1.0, 3.0]
  },
  "artifacts": {
    "out_dir": "./artifacts",
    "best_metric": "f1"
  }
}
